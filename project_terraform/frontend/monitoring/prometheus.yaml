apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

    - job_name: prometheus
      static_configs:
      - targets: ['localhost:9090']

    - job_name: node-exporter
      static_configs:
        - targets:
           - "192.168.128.129:9100"
          labels:
            nodename: "k8s-master"
        - targets:
            - "192.168.128.126:9100"
          labels:
            nodename: "k8s-worker2"

        - targets:
            - "192.168.128.127:9100"
          labels:
            nodename: "k8s-worker1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:

    metadata:
      labels:
        app: prometheus

    spec:

      nodeSelector:
        kubernetes.io/hostname: k8s-master

      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

      containers:

      - name: prometheus

        image: prom/prometheus:v3.3.1

        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h

        ports:
        - containerPort: 9090

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        volumeMounts:
        - name: config
          mountPath: /etc/prometheus

        - name: data
          mountPath: /prometheus

      volumes:

      - name: config
        configMap:
          name: prometheus-config

      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring

spec:
  selector:
    app: prometheus

  ports:
  - port: 9090
    targetPort: 9090
