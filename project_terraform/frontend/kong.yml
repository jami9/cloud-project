_format_version: "3.0"

services:
  - name: openstack-api
    # Utilise la variable d'env (Kong la lit depuis docker-compose env_file)
    url: http://${OPENSTACK_HOST}:${OPENSTACK_APP_PORT}
    connect_timeout: 10000
    read_timeout:    30000
    write_timeout:   30000
    routes:
      - name: api-route
        paths:
          - /api/
        strip_path: false
        methods: [GET, POST, PUT, DELETE, OPTIONS]

plugins:
  - name: cors
    config:
      origins: ["*"]
      methods: [GET, POST, PUT, DELETE, OPTIONS]
      headers:
        - Accept
        - Content-Type
        - Authorization
        - X-Auth-Token
      credentials: false
      max_age: 3600
