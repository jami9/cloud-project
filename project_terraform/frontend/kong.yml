_format_version: "3.0"

services:
  - name: openstack-api
    url: http://192.168.56.101:5005
    connect_timeout: 10000
    read_timeout:    30000
    write_timeout:   30000

    routes:
      - name: api-route
        paths:
          - /api/
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - X-Auth-Token
        - X-OS-Project
        - X-OS-User
        - Authorization
      exposed_headers:
        - X-Auth-Token
      credentials: false
      max_age: 3600
      preflight_continue: false
