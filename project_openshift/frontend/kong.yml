_format_version: "3.0"
_transform: true

services:
  - name: openstack-backend
    url: http://192.168.56.104:5000
    connect_timeout: 10000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: false
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      - name: health-route
        paths:
          - /health
        strip_path: false
        methods:
          - GET

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
        - Authorization
        - X-Requested-With
      exposed_headers:
        - X-Auth-Token
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 300
      policy: local

  - name: response-transformer
    config:
      add:
        headers:
          - "X-Gateway: Kong-OpenStack-Dashboard"
          - "X-Backend: 192.168.56.104"
